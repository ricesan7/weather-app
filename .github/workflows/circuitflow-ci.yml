name: CircuitFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test AI conversation gateway
        working-directory: ai-gateway
        run: npm test
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run Kotlin and Android unit tests
        run: gradle test :test-harness:test :transport-ble-android:testDebugUnitTest :feature-bench:testDebugUnitTest :feature-control:testDebugUnitTest :feature-editor:testDebugUnitTest :app:testDebugUnitTest
      - name: Assemble Android debug APK
        run: gradle :app:assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: circuitflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Configure Universal Runtime core
        run: cmake -S esp32-runtime -B esp32-runtime/build
      - name: Build Universal Runtime core
        run: cmake --build esp32-runtime/build
      - name: Test Universal Runtime core
        run: ctest --test-dir esp32-runtime/build --output-on-failure

  esp-idf-smoke:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 Runtime BLE smoke firmware
        shell: bash
        working-directory: esp32-runtime/esp-idf-smoke
        run: |
          source "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
