name: AI Electronics Builder CI

on:
  push:
    branches: [ main ]
    paths:
      - "ai-electronics-builder/**"
      - ".github/workflows/ai-electronics-builder-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "ai-electronics-builder/**"
      - ".github/workflows/ai-electronics-builder-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run Kotlin and Android unit tests
        working-directory: ai-electronics-builder
        run: gradle test :transport-ble-android:testDebugUnitTest :feature-control:testDebugUnitTest
      - name: Configure Universal Runtime core
        working-directory: ai-electronics-builder
        run: cmake -S esp32-runtime -B esp32-runtime/build
      - name: Build Universal Runtime core
        working-directory: ai-electronics-builder
        run: cmake --build esp32-runtime/build
      - name: Test Universal Runtime core
        working-directory: ai-electronics-builder
        run: ctest --test-dir esp32-runtime/build --output-on-failure

  esp-idf-smoke:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 Runtime BLE smoke firmware
        shell: bash
        working-directory: ai-electronics-builder/esp32-runtime/esp-idf-smoke
        run: |
          source "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
