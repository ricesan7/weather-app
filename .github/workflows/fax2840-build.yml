name: Build FAX-2840 Android APK

on:
  push:
    branches:
      - fax2840-apk-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Regression test - PrintJob main-thread usage
        run: python3 Fax2840UsbPrint/tests/test_printjob_threading.py

      - name: Regression test - v0.4 diagnostics
        run: python3 Fax2840UsbPrint/tests/test_v04_diagnostics.py

      - name: Regression test - v0.5 seekable PDF spool
        run: python3 Fax2840UsbPrint/tests/test_v05_seekable_pdf.py

      - name: Regression test - v0.6 printable area and dithering
        run: python3 Fax2840UsbPrint/tests/test_v06_print_quality.py

      - name: Regression test - v0.7 density control
        run: python3 Fax2840UsbPrint/tests/test_v07_density_control.py

      - name: Regression test - v0.8 split-page printing
        run: python3 Fax2840UsbPrint/tests/test_v08_page_split.py

      - name: Regression test - v0.9 content crop and split
        run: python3 Fax2840UsbPrint/tests/test_v09_content_split.py

      - name: Regression test - v1.0 shared PDF preview
        run: python3 Fax2840UsbPrint/tests/test_v10_shared_preview.py

      - name: Regression test - v1.1 UI redesign
        run: python3 Fax2840UsbPrint/tests/test_v11_ui_redesign.py

      - name: Regression test - v1.2 print orientation
        run: python3 Fax2840UsbPrint/tests/test_v12_print_orientation.py

      - name: Regression test - v1.2.1 system bar insets
        run: python3 Fax2840UsbPrint/tests/test_v121_system_bar_insets.py

      - name: Regression test - v1.2.2 launch-safe system bars
        run: python3 Fax2840UsbPrint/tests/test_v122_launch_safe_system_bars.py

      - name: Regression test - v1.3 USB connection guide
        run: python3 Fax2840UsbPrint/tests/test_v13_usb_connection_guide.py

      - name: Regression test - v1.3.1 auto layout scaling
        run: python3 Fax2840UsbPrint/tests/test_v131_auto_layout.py

      - name: Regression test - v1.3.2 app icon
        run: python3 Fax2840UsbPrint/tests/test_v132_app_icon.py

      - name: Regression test - v1.3.4 prepared PDF orientation handoff
        run: python3 Fax2840UsbPrint/tests/test_v134_orientation_handoff.py

      - name: Regression test - v1.3.5 extended density curve
        run: python3 Fax2840UsbPrint/tests/test_v135_density_curve.py

      - name: Regression test - v1.3.6 wide table readability
        run: python3 Fax2840UsbPrint/tests/test_v136_wide_tables.py

      - name: Regression test - v1.3.7 direct Excel CSV printing
        run: python3 Fax2840UsbPrint/tests/test_v137_direct_tables.py

      - name: Regression test - v1.3.7 navigation and spreadsheet help
        run: python3 Fax2840UsbPrint/tests/test_v137_navigation_help.py

      - name: Regression test - v1.3.8 USB backpressure
        run: python3 Fax2840UsbPrint/tests/test_v138_usb_backpressure.py

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: Fax2840UsbPrint
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fax2840UsbPrint-debug-apk
          path: Fax2840UsbPrint/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK
        run: |
          mkdir -p fax2840-build
          cp Fax2840UsbPrint/app/build/outputs/apk/debug/app-debug.apk fax2840-build/Fax2840UsbPrint-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fax2840-build/Fax2840UsbPrint-debug.apk
          git diff --cached --quiet || git commit -m "Build FAX-2840 debug APK"
          git push
